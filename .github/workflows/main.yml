name: main
on:
  push:
    branches:
      - master
      - main
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # https://devguide.python.org/versions/
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest] # , windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lock Check
        run: uv lock --check
      - name: Install Dependencies
        run: |
          uv build
          uv sync --locked
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Code Coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && github.ref != 'refs/heads/main'
        run: make coverage
      - name: Code Coverage Report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && github.ref != 'refs/heads/main'
        uses: romeovs/lcov-reporter-action@2a28ec3e25fb7eae9cb537e9141603486f810d1a # https://github.com/romeovs/lcov-reporter-action/issues/46
        with:
          lcov-file: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Release
        id: release
        uses: go-semantic-release/action@v1
        if: github.ref == 'refs/heads/main'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
      # Prerelease
      - name: Bump Version (Prerelease)
        id: prerelease
        if: github.ref != 'refs/heads/main' && github.event_name == 'pull_request'
        run: |
          VERSION=$(uv version --short)
          BASE_VERSION=$(git show "${{ github.event.pull_request.base.sha }}:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p')

          # Preserve an explicit version bump; otherwise default to the next patch.
          if [ "$VERSION" = "$BASE_VERSION" ]; then
            VERSION=$(uv version --bump patch --dry-run --short)
          fi

          # add prerelease version identifier
          VERSION="${VERSION}b${{ github.run_number }}" # _${{ github.run_attempt }}"

          uv version "$VERSION"

          # ensure the published package links back to the pull request
          PULL_REQUEST_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          sed "s|^Repository =.*|Repository = \"https://github.com/kiran94/bookworm/pull/$PULL_REQUEST_NUMBER\"|" pyproject.toml -i

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Deploy (Prerelease)
        if: github.ref != 'refs/heads/main' && github.event_name == 'pull_request'
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
      - name: Comment (Prerelease)
        if: github.ref != 'refs/heads/main' && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            Change was prereleased to pypi. Try it out :rocket:

            ```bash
            python -m pip install bookworm_genai==${{steps.prerelease.outputs.VERSION}}
            ```

            https://pypi.org/project/bookworm_genai/${{steps.prerelease.outputs.VERSION}}/
          comment_tag: execution
      # Main Release
      - name: Bump Version
        if: github.ref == 'refs/heads/main' && steps.release.outputs.version != ''
        run: uv version "${{ steps.release.outputs.version }}"
      - name: Deploy
        if: github.ref == 'refs/heads/main' && steps.release.outputs.version != ''
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
      - uses: EndBug/add-and-commit@v9
        if: github.ref == 'refs/heads/main' && steps.release.outputs.version != ''
        with:
          message: "chore(version): bump"
          default_author: github_actions
          add: pyproject.toml uv.lock
